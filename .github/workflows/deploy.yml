name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # 1. 빌드 및 Docker Hub 푸시 작업
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/exchange-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/exchange-frontend:latest
          build-args: |
            VITE_API_URL=http://${{ secrets.EC2_HOST }}:8080/api/v1/exchange-rates

  # 2. EC2 서버 접속 및 배포 작업
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # 1. 환경변수 파일 생성
            echo "${{ secrets.ENV_FILE }}" > .env
            
            # 2. 프로덕션용 docker-compose.yml 생성 (빌드 대신 Docker Hub의 이미지를 Pull 받도록 설정)
            cat << 'EOF' > docker-compose.yml
            services:
              postgres:
                image: postgres:15-alpine
                container_name: exchange-postgres
                ports:
                  - "5432:5432"
                env_file: .env
                environment:
                  - POSTGRES_DB=exchange_db
                  - POSTGRES_USER=${DB_USER}
                  - POSTGRES_PASSWORD=${DB_PASSWORD}
                volumes:
                  - postgres-data:/var/lib/postgresql/data
                restart: always
            
              redis:
                image: redis:7-alpine
                container_name: exchange-redis
                ports:
                  - "6379:6379"
                volumes:
                  - redis-data:/data
                restart: always
            
              backend:
                image: ${{ secrets.DOCKER_USERNAME }}/exchange-backend:latest
                container_name: exchange-backend
                ports:
                  - "8080:8080"
                env_file: .env
                environment:
                  - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/exchange_db
                  - SPRING_DATA_REDIS_HOST=redis
                depends_on:
                  - postgres
                  - redis
                restart: always
            
              frontend:
                image: ${{ secrets.DOCKER_USERNAME }}/exchange-frontend:latest
                container_name: exchange-frontend
                ports:
                  - "80:80"
                depends_on:
                  - backend
                restart: always
            
            volumes:
              postgres-data:
              redis-data:
            EOF
            
            # 3. 최신 이미지 다운로드 및 백그라운드 무중단 실행
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker image prune -f