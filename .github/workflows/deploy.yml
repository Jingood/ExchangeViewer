name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # 1. 빌드 및 Docker Hub 푸시 작업
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/exchange-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/exchange-frontend:latest
          build-args: |
            VITE_API_URL=http://${{ secrets.EC2_HOST }}:8080/api/v1/exchange-rates

  # 2. EC2 서버 접속 및 배포 작업
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # 2. EC2 서버 접속 및 배포 작업 (deploy 스텝 전체 교체)
    steps:
      - name: Deploy with Zero-Downtime
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "${{ secrets.ENV_FILE }}" > .env
            
            cat << 'EOF' > docker-compose.yml
            services:
              postgres:
                image: postgres:15-alpine
                container_name: exchange-postgres
                ports:
                  - "5432:5432"
                env_file: .env
                environment:
                  - POSTGRES_DB=exchange_db
                  - POSTGRES_USER=${DB_USER}
                  - POSTGRES_PASSWORD=${DB_PASSWORD}
                volumes:
                  - postgres-data:/var/lib/postgresql/data
                restart: always
            
              redis:
                image: redis:7-alpine
                container_name: exchange-redis
                ports:
                  - "6379:6379"
                volumes:
                  - redis-data:/data
                restart: always
            
              backend-blue:
                image: ${{ secrets.DOCKER_USERNAME }}/exchange-backend:latest
                container_name: exchange-backend-blue
                env_file: .env
                environment:
                  - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/exchange_db
                  - SPRING_DATA_REDIS_HOST=redis
                restart: always
            
              backend-green:
                image: ${{ secrets.DOCKER_USERNAME }}/exchange-backend:latest
                container_name: exchange-backend-green
                env_file: .env
                environment:
                  - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/exchange_db
                  - SPRING_DATA_REDIS_HOST=redis
                restart: always
            
              frontend:
                image: ${{ secrets.DOCKER_USERNAME }}/exchange-frontend:latest
                container_name: exchange-frontend
                ports:
                  - "80:80"
                restart: always
            
            volumes:
              postgres-data:
              redis-data:
            EOF
            
            # 1. 최신 이미지 Pull
            sudo docker compose pull
            
            # 2. 현재 실행 상태 확인 및 타겟 설정
            if sudo docker ps | grep -q exchange-frontend; then
                CURRENT_URL=$(sudo docker exec exchange-frontend cat /etc/nginx/conf.d/service-url.inc)
                if echo "$CURRENT_URL" | grep -q "blue"; then
                    TARGET="green"
                    CURRENT="blue"
                else
                    TARGET="blue"
                    CURRENT="green"
                fi
                echo "현재 $CURRENT 실행 중. $TARGET 배포 시작."
            else
                echo "초기 구동. blue 배포 시작."
                TARGET="blue"
                CURRENT="none"
            fi
            
            # 3. 공통 인프라 및 타겟 백엔드 컨테이너 띄우기
            sudo docker compose up -d postgres redis frontend backend-$TARGET
            
            # 4. Spring Boot 부팅 대기 (t2.micro 스왑 메모리 환경을 감안하여 20초 대기)
            echo "20초 동안 $TARGET 백엔드 헬스 체크 대기..."
            sleep 20
            
            # 5. Nginx 트래픽 무중단 스위칭 (Nginx 재시작 없이 설정만 Reload)
            sudo docker exec exchange-frontend sh -c "echo 'set \$service_url http://exchange-backend-${TARGET}:8080;' > /etc/nginx/conf.d/service-url.inc"
            sudo docker exec exchange-frontend nginx -s reload
            
            # 6. 이전 버전(구버전) 컨테이너 폭파 및 잉여 이미지 청소
            if [ "$CURRENT" != "none" ]; then
                sudo docker compose stop backend-$CURRENT
                sudo docker compose rm -f backend-$CURRENT
            fi
            sudo docker image prune -f